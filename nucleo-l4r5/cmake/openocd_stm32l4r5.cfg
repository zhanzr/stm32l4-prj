# OpenOCD configuration for the STM32L4R5ZIT6 "nucleo-l4r5" board, debugged
# through an ST-Link (V2/V3) over SWD.
#
# Usage:
#   openocd -f cmake/openocd_stm32l4r5.cfg -c "program app.hex verify reset exit"
#   openocd -f cmake/openocd_stm32l4r5.cfg        # interactive; telnet 4444

source [find interface/stlink.cfg]

# SWD transport.
transport select swd

# Work-area in SRAM used for flash programming (STM32L4R5: 640 KB SRAM total;
# 64 KB is plenty for the flash loader).
set WORKAREASIZE 0x10000
# Let OpenOCD auto-detect the CPU IDCODE instead of pinning one revision.
set CPUTAPID 0

source [find target/stm32l4x.cfg]

# stm32l4x flash driver auto-detects the 2 MB bank size from the chip.
adapter speed 4000
